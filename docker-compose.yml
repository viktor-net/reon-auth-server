# DEV-стенд аутентификации/авторизации ИС РЕОН 2.0.
#
# Состав:
#   reon-auth-nginx         — reverse proxy, единая точка входа (порт 10010)
#   reon-auth-keycloak      — IdP Keycloak (порт 10009, только для отладки/админки)
#   reon-auth-postgres      — БД Keycloak (порт 10008)
#   reon-auth-keycloak-init — one-shot применение realm.yml и dev-users.yml
#                             через keycloak-config-cli (идемпотентно)
#   reon-auth-scalar        — Scalar API Reference: интерактивная документация
#                             OpenAPI, публикуется nginx по адресу /docs/
#
# Все секреты читаются из окружения (см. .env.example). Значения по умолчанию —
# только DEV-заглушки, чтобы `docker compose up -d` работал с чистого клона.
#
# Порты 10000-10007 заняты смежным стендом (reon-s3-*) — не использовать.

name: reon-auth

services:
  reon-auth-postgres:
    image: postgres:16-alpine
    container_name: reon-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-keycloak-db-change-me}
    ports:
      - "10008:5432"
    volumes:
      - reon-auth-keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - reon-auth

  reon-auth-keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: reon-auth-keycloak
    restart: unless-stopped
    # start-dev: DEV-режим (http, без строгой проверки hostname). Продовый режим
    # `start` требует TLS/hostname и на локальном стенде не нужен.
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://reon-auth-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-keycloak-db-change-me}
      # Bootstrap-администратор master realm (Keycloak 26: KC_BOOTSTRAP_ADMIN_*).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-dev-admin-change-me}
      # Внешний адрес IdP фиксирован: все issuer/redirect URL в токенах указывают
      # на точку входа nginx, а не на внутренний порт Keycloak.
      # Публичный адрес issuer: токены и discovery всегда указывают на прокси.
      KC_HOSTNAME: http://localhost:10010
      # Админка живёт на прямом порту, чтобы её можно было закрыть в прокси
      # продуктовым профилем (задача 08), не ломая вход пользователей.
      KC_HOSTNAME_ADMIN: http://localhost:10009
      KC_HTTP_ENABLED: "true"
      # Доверяем X-Forwarded-* от nginx.
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      # Фича scripts НЕ включается: в Keycloak 26.5.5 скриптовых protocol
      # mappers нет (SCRIPTS оставляет только script-аутентификаторы), поэтому
      # claim org_id собирается штатным oidc-usermodel-attribute-mapper из
      # пользовательского атрибута (см. комментарий у маппера org_id в
      # docker/keycloak/realm.yml). Это снимает риск от preview-фичи.
    ports:
      - "10009:8080"
    depends_on:
      reon-auth-postgres:
        condition: service_healthy
    # Health-эндпоинты Keycloak 26 живут на management-порту 9000.
    # curl в образе нет, поэтому проверяем через bash /dev/tcp.
    healthcheck:
      test:
        - CMD-SHELL
        - "{ printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; head -1 | grep -q ' 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - reon-auth

  # One-shot сервис: применяет docker/keycloak/*.yml и завершается.
  # Повторный запуск (`docker compose run --rm reon-auth-keycloak-init`)
  # идемпотентен: keycloak-config-cli приводит realm к состоянию из файлов.
  reon-auth-keycloak-init:
    image: quay.io/adorsys/keycloak-config-cli:6.5.1-26.5.5
    container_name: reon-auth-keycloak-init
    restart: "no"
    environment:
      KEYCLOAK_URL: http://reon-auth-keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-dev-admin-change-me}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*.yml
      # Подстановка $(env:...) в realm.yml: секреты clients не хранятся в конфиге.
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
      LOGGING_LEVEL_ROOT: info
      REON_SERVICE_CLIENT_SECRET: ${REON_SERVICE_CLIENT_SECRET:-dev-reon-service-secret-change-me}
      REON_DEV_SMOKE_CLIENT_SECRET: ${REON_DEV_SMOKE_CLIENT_SECRET:-dev-reon-dev-smoke-secret-change-me}
    # Порядок импорта важен: keycloak-config-cli сортирует файлы по пути, а
    # пользователи ссылаются на группы по путям (/reon/hq), поэтому realm.yml
    # с группами должен примениться первым. Имена файлов в репозитории остаются
    # смысловыми, а порядок задаётся точками монтирования.
    volumes:
      - ./docker/keycloak/realm.yml:/config/10-realm.yml:ro
      - ./docker/keycloak/dev-users.yml:/config/20-dev-users.yml:ro
    depends_on:
      reon-auth-keycloak:
        condition: service_healthy
    networks:
      - reon-auth

  # One-shot сервис: применяет синтетические клиенты и пользователей поверх
  # уже импортированного realm (partial import, "ifResourceExists": "SKIP").
  # Роли и привязки ролей к группам — в realm.yml (partial import SKIP не
  # обновляет существующие группы). Повторный запуск идемпотентен.
  reon-auth-synthetic-init:
    image: curlimages/curl:8.11.0
    container_name: reon-auth-synthetic-init
    restart: "no"
    # Скрипт монтируется из ./docker/keycloak/synthetic; запускаем через sh,
    # потому что entrypoint образа — curl.
    entrypoint: ["/bin/sh", "/data/init.sh"]
    environment:
      KEYCLOAK_URL: http://reon-auth-keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-dev-admin-change-me}
      REALM: reon
      # Секреты синтетических сервисных клиентов (только DEV-заглушки).
      MDM_SERVICE_CLIENT_SECRET: ${MDM_SERVICE_CLIENT_SECRET:-dev-mdm-service-secret-change-me}
      REON_S3_SERVER_CLIENT_SECRET: ${REON_S3_SERVER_CLIENT_SECRET:-dev-reon-s3-server-secret-change-me}
      REON_PROCESS_BACKEND_CLIENT_SECRET: ${REON_PROCESS_BACKEND_CLIENT_SECRET:-dev-reon-process-backend-secret-change-me}
    volumes:
      - ./docker/keycloak/synthetic:/data:ro
    depends_on:
      reon-auth-keycloak:
        condition: service_healthy
      # Синтетика применяется только после базового импорта: нужен существующий
      # realm с группами и client scopes.
      reon-auth-keycloak-init:
        condition: service_completed_successfully
    networks:
      - reon-auth

  reon-auth-nginx:
    image: nginx:1.27-alpine
    container_name: reon-auth-nginx
    restart: unless-stopped
    ports:
      - "10010:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Страница-указатель монтируется файлом: в nginx.conf она не помещается
      # целиком (лимит параметра return 200 ~4094 байта), а ссылки добавляют объём.
      - ./docker/nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      reon-auth-keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - reon-auth

  # Scalar API Reference: рендерит docs/api/openapi.yaml в интерактивную
  # документацию с кнопкой «Try it». Наружу публикуется только через nginx
  # (location /docs/), чтобы запросы из браузера шли same-origin с API и CORS
  # не требовался. Прямой порт 10011 — для отладки самого контейнера.
  reon-auth-scalar:
    image: scalarapi/api-reference:0.6.21
    container_name: reon-auth-scalar
    restart: unless-stopped
    environment:
      # Префикс, под которым контейнер раздаёт UI и ассеты. Nginx срезает
      # /docs/ перед проксированием (proxy_pass с завершающим /).
      BASE_PATH: /docs
      # Scalar по умолчанию раскрывает первый тег (OIDC) в левой панели.
      # false оставляет все группы свёрнутыми до выбора пользователя.
      # `sources` не задаём: спецификация монтируется в /docs и контейнер
      # добавляет её к этой конфигурации сам.
      API_REFERENCE_CONFIG: '{"defaultOpenFirstTag": false}'
    ports:
      - "10011:8080"
    volumes:
      # Спецификация монтируется как каталог документов: контейнер сам находит
      # *.yaml и отдаёт их по /openapi/<имя файла>.
      - ./docs/api:/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - reon-auth

volumes:
  reon-auth-keycloak-db:

networks:
  reon-auth:
    name: reon-auth
