# Reverse proxy DEV-стенда ИС РЕОН 2.0: единая точка входа в Keycloak.
#
# Проксируются:
#   /realms/    — OIDC-эндпоинты (discovery, token, auth, userinfo, certs)
#   /admin/     — Admin REST API и консоль Keycloak
#   /resources/ — статика страницы входа Keycloak (иначе форма без стилей)
#
# Снаружи стенд доступен как http://localhost:8090, и именно этот адрес указан
# в KC_HOSTNAME, поэтому issuer в токенах — http://localhost:8090/realms/reon.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # --- Лимиты под крупный JWT ---
    # Access-токен РЕОН с ролями, полными путями групп и org_id легко превышает
    # стандартный лимит nginx на строку заголовка (large_client_header_buffers
    # по умолчанию 4 x 8k) — тогда nginx отвечает 400/414/431 ещё до Keycloak.
    # Поднимаем лимиты до 32 КБ и увеличиваем буферы для ответов Keycloak
    # (заголовки Set-Cookie и большие ответы admin API).
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    upstream keycloak {
        server reon-auth-keycloak:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Healthcheck стенда (docker compose healthcheck сервиса nginx).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # OIDC-эндпоинты realm: discovery, authorization, token, userinfo, jwks.
        location /realms/ {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            # Порт точки входа фиксирован для DEV-стенда (см. docker-compose.yml).
            proxy_set_header X-Forwarded-Port 8090;
        }

        # Admin REST API и консоль Keycloak.
        location /admin/ {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8090;
        }

        # Статика страницы входа и консоли (темы Keycloak).
        location /resources/ {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8090;
        }

        # Всё остальное через proxy не публикуется: стенд — только IdP.
        location / {
            add_header Content-Type text/plain;
            return 404 "reon-auth dev stand: OIDC /realms/, admin console /admin/, assets /resources/\n";
        }
    }
}
