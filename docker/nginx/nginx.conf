# Reverse proxy DEV-стенда ИС РЕОН 2.0: единая точка входа в Keycloak.
#
# Проксируются:
#   /realms/    — OIDC-эндпоинты (discovery, token, auth, userinfo, certs)
#   /admin/     — Admin REST API и консоль Keycloak
#   /resources/ — статика страницы входа Keycloak (иначе форма без стилей)
#   /docs/      — Scalar API Reference (интерактивная документация OpenAPI)
#
# Снаружи стенд доступен как http://localhost:8090, и именно этот адрес указан
# в KC_HOSTNAME, поэтому issuer в токенах — http://localhost:8090/realms/reon.
# Документация живёт на том же origin (http://localhost:8090/docs/), поэтому
# кнопка «Try it» обращается к API без cross-origin запросов и CORS не нужен.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # --- Лимиты под крупный JWT ---
    # Access-токен РЕОН с ролями, полными путями групп и org_id легко превышает
    # стандартный лимит nginx на строку заголовка (large_client_header_buffers
    # по умолчанию 4 x 8k) — тогда nginx отвечает 400/414/431 ещё до Keycloak.
    # Поднимаем лимиты до 32 КБ и увеличиваем буферы для ответов Keycloak
    # (заголовки Set-Cookie и большие ответы admin API).
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    upstream keycloak {
        server reon-auth-keycloak:8080;
        keepalive 16;
    }

    # Scalar API Reference: раздаёт HTML документации, JS-ассеты и сам
    # openapi.yaml. keepalive не нужен: ответы короткие и статические.
    upstream scalar {
        server reon-auth-scalar:8080;
    }

    server {
        listen 8080;
        server_name _;

        # Healthcheck стенда (docker compose healthcheck сервиса nginx).
        # default_type, а не add_header: add_header не применяется к 404 и
        # вместе с default_type давал два заголовка Content-Type.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Страница-указатель на точке входа: раньше / отдавал 404 с типом
        # application/octet-stream, и браузер скачивал ответ вместо рендера
        # (ERR_INVALID_RESPONSE). HTML вынесен в docker/nginx/index.html и
        # монтируется в контейнер: в виде параметра return 200 он упирался в
        # лимит строки nginx (~4094 байта, запас был 19 байт), поэтому ссылки
        # на страницу было не добавить. Данных кроме адресов DEV-стенда нет.
        # try_files, а не alias на файл: директива index дописывает «index.html»
        # к пути alias и получается «…/index.htmlindex.html» → 500. try_files
        # отдаёт файл в текущем location, без внутреннего редиректа на
        # /index.html (его бы поймал catch-all / и вернул 404).
        # charset даёт text/html; charset=utf-8.
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            charset utf-8;
        }

        # OIDC-эндпоинты realm: discovery, authorization, token, userinfo, jwks.
        location /realms/ {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            # Порт точки входа фиксирован для DEV-стенда (см. docker-compose.yml).
            proxy_set_header X-Forwarded-Port 8090;
        }

        # Admin REST API и консоль Keycloak.
        location /admin/ {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8090;
        }

        # Статика страницы входа и консоли (темы Keycloak).
        location /resources/ {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8090;
        }

        # Интерактивная документация API (Scalar). BASE_PATH контейнера = /docs,
        # поэтому клиентские URL уже содержат этот префикс, а завершающий «/»
        # у proxy_pass срезает его перед проксированием: /docs/openapi/openapi.yaml
        # превращается в /openapi/openapi.yaml внутри контейнера.
        location /docs/ {
            proxy_pass http://scalar/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8090;
        }

        # Без завершающего «/» Scalar не откроется: редиректим на канонический адрес.
        # absolute_redirect off — Location остаётся относительным, иначе nginx
        # подставляет внутренний порт контейнера (8080), недоступный снаружи.
        location = /docs {
            absolute_redirect off;
            return 301 /docs/;
        }

        # Всё остальное через proxy не публикуется: стенд — IdP и его документация.
        location / {
            add_header Content-Type text/plain;
            return 404 "reon-auth dev stand: OIDC /realms/, admin console /admin/, assets /resources/, api docs /docs/\n";
        }
    }
}
